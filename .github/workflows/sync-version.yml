name: Sync site version and download links to latest release

# The version and the download URLs baked into index.html are what everything that does
# not run JavaScript reads -- search crawlers, AI answer engines, link unfurlers, and any
# visitor whose request hit GitHub's anonymous API limit and fell back. Nothing kept this
# file honest before and it showed: the page claimed 0.38.3 while 0.42.0 was shipping.
#
# The download links matter more than the label. The install section offers one tile per
# build now -- six of them, across three operating systems and two architectures --
# linking the release FILE, so that clicking "Linux ARM64" downloads the Linux ARM64
# build rather than opening a page with six archives to tell apart by filename. Those
# URLs carry the version, and so do the filenames, so without this job they 404 the day
# after a release.
#
# Three triggers on purpose:
#   schedule            - the safety net. Nothing has to be wired up for this to work.
#   workflow_dispatch   - a button, for when a release just went out and waiting is silly.
#   repository_dispatch - so the product repo's release job can poke this the moment it
#                         publishes. Needs a PAT over there; until one exists the
#                         schedule still covers it, which is why the schedule is not
#                         merely a backup.

on:
  schedule:
    # 07:10 UTC daily. Off the hour because every scheduler on GitHub fires on it and the
    # queue there is measured in tens of minutes.
    - cron: '10 7 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [release-published]

permissions:
  contents: write

concurrency:
  group: sync-version
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Rewrite the version and download links from the latest release
        env:
          # Lifts the 60-per-hour anonymous API limit. Read-only; the write below uses the
          # checkout's own credentials.
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/sync-version.mjs

      - name: Commit if it changed
        run: |
          if git diff --quiet -- index.html; then
            echo "already current; nothing to commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.html
          git commit -m "Sync the site version and download links to the latest release

          Generated by .github/workflows/sync-version.yml. The version and the release
          asset URLs in this file are what crawlers, answer engines and no-JS visitors
          read, and a pinned asset URL 404s the day after a release if nobody moves it."
          git push
